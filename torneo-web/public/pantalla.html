<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torneo de Prompts TEINCO 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
/* Pantalla proyectada: tipografía grande, una sola cosa protagonista por momento */
body{padding-inline:clamp(16px,3vw,48px);padding-block:22px 48px;overflow-x:hidden}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px 24px;margin-bottom:clamp(18px,3vh,32px)}
header h1{font-size:clamp(1.8rem,3.6vw,3rem);letter-spacing:-.04em}
header h1 span{color:var(--accent)}
header h1 small{font:600 .42em var(--body);letter-spacing:0;color:var(--muted);margin-left:.5em;vertical-align:middle}
#phase{font-family:var(--display);font-weight:600;font-size:clamp(1.1rem,1.8vw,1.5rem);letter-spacing:-.02em;background:var(--panel);padding:10px 18px;border-radius:999px}
#phase:empty{display:none}
.fxbar{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
.fxbar select{font-size:.85rem;padding:9px 14px;max-width:280px}
.fxwarn{margin:0;width:100%;font-size:.9rem;color:var(--gold-ink)}
/* registro */
.join{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:clamp(20px,4vw,56px);background:var(--panel);border-radius:var(--r-lg);padding:clamp(22px,3.5vw,44px);margin-bottom:22px}
.join .k{font-size:clamp(1.1rem,1.8vw,1.5rem);color:var(--muted)}
.join .url{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,5.4rem);letter-spacing:-.05em;color:var(--ink);overflow-wrap:anywhere;line-height:.95;margin:.12em 0 .2em}
#qr{background:#fff;padding:14px;border-radius:var(--r-md);line-height:0;box-shadow:0 0 0 1px var(--line)}
.count{font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,2vw,1.7rem);color:var(--accent-ink)}
@media (max-width:700px){.join{grid-template-columns:minmax(0,1fr)}#qr{justify-self:start}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:999px;padding:8px 20px 8px 8px;font-weight:600;font-size:1.1rem;min-width:0}
.chip .av{font-size:1.05rem}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.new{animation:pop .45s var(--ease) both}
.chip.out{opacity:.4}
/* bloque principal de cada momento */
.stage{background:var(--panel);border-radius:var(--r-lg);padding:clamp(20px,3vw,34px) 18px;text-align:center}
.stage .k{font-size:clamp(1.15rem,2vw,1.7rem)!important;color:var(--ink)}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;margin-top:18px}
.side{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.side .av{font-size:clamp(2.6rem,6.5vw,5rem)}
.side .nm{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4.8vw,4.2rem);letter-spacing:-.04em;line-height:.95;overflow-wrap:anywhere}
.side.set .nm{color:var(--accent)} .side.spin .av{animation:pulse .3s infinite}
.vs{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,2.4vw,2rem);color:#9aa3b5}
#clock{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,13vw,10rem);letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;margin-top:10px}
#clock.low{color:var(--bad);animation:pulse 1s var(--ease) infinite}
#clock.end{color:var(--bad);animation:blink .7s infinite;font-size:clamp(3rem,9vw,7rem)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:18px}
.pair{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:var(--r-md);padding:10px 14px;min-width:0;font-weight:500}
.pair .n{font-family:var(--display);font-weight:700;color:#9aa3b5;width:2ch;font-variant-numeric:tabular-nums}
.pair .who{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.pair .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* duelos de la fase */
.duels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;margin-top:16px}
.dc{background:var(--panel);border-radius:var(--r-lg);padding:16px;text-align:center;cursor:zoom-in;transition:transform .2s var(--ease)}
@media (hover:hover) and (pointer:fine){.dc:hover{transform:translateY(-2px)}}
.dc.done{box-shadow:0 0 0 2px var(--win)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.dside{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.dside .av{font-size:2.6rem} .dside span:last-child{overflow-wrap:anywhere}
.dside.w{color:var(--win)} .dside.l{opacity:.35}
.dc .vs{font-size:1.2rem}
.dc .drow{align-items:start} .dc .drow>.vs{align-self:center;margin-bottom:2.4em}
.dc .dside .av{font-size:1.4rem}
.dc .dside .row{flex-wrap:nowrap;min-height:2.6em;font-size:1.3rem;min-width:0}
.dc .dside .row span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{aspect-ratio:4/3;width:100%;border-radius:var(--r-md);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-family:var(--body);font-weight:500;font-size:.95rem;letter-spacing:0;padding:10px}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic.has{padding:0;background:#fff}
.dside.w .pic{box-shadow:0 0 0 3px var(--win)}
.pic.st{font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:-.02em}
.pic.st.ok{background:var(--winbg);color:var(--win)}
.pic.miss{background:var(--bad-soft);color:var(--bad);font-family:var(--display);font-weight:600;font-size:1.3rem}
/* referencia */
.refb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:center;background:var(--gold-soft);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,28px);margin-top:16px}
.refb.notxt{grid-template-columns:minmax(0,1fr)}
.refb .k{color:var(--gold-ink);font-size:1.15rem}
.refb .reft p{margin:10px 0 0;font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:clamp(1.2rem,2.2vw,1.8rem);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
.refb.big .pic{aspect-ratio:auto;height:56vh}
.refb.big .reft p{font-size:clamp(1.5rem,3vw,2.8rem);line-height:1.15}
.refb:not(.big) .pic{max-height:260px}
/* resultados llave por llave */
.one{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr);gap:clamp(12px,2vw,24px);align-items:start;margin-top:16px}
.one .oside{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.one .pic{aspect-ratio:auto;height:min(48vh,560px);background:#fff}
.one .oref .pic{box-shadow:0 0 0 3px var(--gold)}
.one .zn{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,2.8vw,2.5rem);letter-spacing:-.035em;line-height:1;text-align:center}
.one .zn .av{font-size:1.4rem}
.one .zt{margin:0;font-size:1.1rem;text-align:center;white-space:pre-wrap;max-height:20vh;overflow:auto;color:var(--muted)}
@media (max-width:800px){.one{grid-template-columns:minmax(0,1fr)}.one .pic{height:40vh}}
/* zoom */
.votehint{text-align:center;margin:14px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(1.05rem,1.8vw,1.4rem);color:var(--accent-ink)}
.vote{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
.vnum{font-size:clamp(1rem,1.6vw,1.3rem);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.vnum b{font-family:var(--display);font-size:1.6em;color:var(--ink);letter-spacing:-.03em}
.vtrack{height:12px;border-radius:999px;background:var(--panel2);overflow:hidden}
.vtrack i{display:block;height:100%;background:#9aa3b5;transform-origin:left;transition:transform .5s var(--ease)}
.vote.lead .vtrack i{background:var(--accent)}
.vote.lead .vnum b{color:var(--accent)}
#zoom{position:fixed;inset:0;background:var(--bg);z-index:4;display:flex;flex-direction:column;gap:16px;padding:clamp(16px,2.4vw,32px);cursor:zoom-out;animation:pop .28s var(--ease) both}
#zoom .zrow{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:center;min-height:0}
#zoom .zrow.three{grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr)}
#zoom .zs{display:flex;flex-direction:column;align-items:center;gap:12px;height:100%;min-height:0;min-width:0}
#zoom .pic{flex:1;aspect-ratio:auto;min-height:0;background:#fff}
#zoom .zref .pic{box-shadow:0 0 0 3px var(--gold)}
#zoom .zn{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,2.8vw,2.5rem);letter-spacing:-.035em;line-height:1}
#zoom .zn .av{font-size:1.5rem}
#zoom .zt{margin:0;font-size:1.1rem;text-align:center;white-space:pre-wrap;max-height:22vh;overflow:auto}
/* llaves */
.tl{font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--muted);margin-top:8px}
.bracket{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px}
.round{flex:1 0 230px;min-width:230px;display:flex;flex-direction:column;gap:12px}
.round h3{font-size:1.2rem;color:var(--muted)}
.round.active h3{color:var(--ink)}
.ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.match{border-radius:var(--r-md);overflow:hidden;background:var(--panel)}
.match.cur{box-shadow:0 0 0 2px var(--accent)}
.slot{display:flex;align-items:center;gap:10px;padding:9px 12px;font-weight:500;min-width:0}
.slot+.slot{box-shadow:inset 0 1px 0 var(--bg)}
.slot span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.slot.w{background:var(--winbg);color:var(--win);font-weight:600}
.slot.l{color:var(--muted);text-decoration:line-through}
.slot.l .av{opacity:.45}
.slot.e{color:#8a93a6}
/* podio */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:26px 0 34px}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 26px;min-width:200px;animation:rise .6s var(--ease) both}
.step .av{font-size:3.2rem} .step .nm{font-family:var(--display);font-weight:700;font-size:1.8rem;letter-spacing:-.035em;text-align:center;overflow-wrap:anywhere;line-height:1}
.step .k{color:var(--muted)}
.step.p1{padding-bottom:96px;background:var(--gold-soft);animation-delay:.12s} .step.p1 .av{font-size:5rem} .step.p1 .k{color:var(--gold-ink)}
.step.p2{padding-bottom:58px} .step.p3{padding-bottom:30px;animation-delay:.24s}
.medal{font-size:2.2rem}
/* superposiciones de celebración */
#overlay{position:fixed;inset:0;background:rgba(241,242,245,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:5;animation:pop .3s var(--ease) both}
#overlay>.av{font-size:clamp(3.5rem,9vw,6.5rem);animation:pop .5s var(--ease) both}
#overlay .soft .av{font-size:1.2em}
#overlay .k{font-size:clamp(1.3rem,2.4vw,2rem)!important;color:var(--muted)}
#overlay .big{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,6rem);letter-spacing:-.05em;line-height:.92;color:var(--ink);animation:enter .5s .05s var(--ease) both;overflow-wrap:anywhere;max-width:16ch}
#overlay .mid{font-size:clamp(1.25rem,2.6vw,2rem);font-weight:600;color:var(--accent-ink);animation:enter .5s .15s var(--ease) both}
#overlay .soft{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-size:clamp(1.05rem,2vw,1.5rem);color:var(--muted);margin-top:18px;background:var(--panel);border-radius:999px;padding:12px 24px;animation:enter .5s 1s var(--ease) both;max-width:900px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
</style>
</head>
<body>
<header>
  <h1>Torneo de <span>Prompts</span><small>TEINCO 2026</small></h1>
  <div class="row"><span id="phase"></span><button id="sound" class="small gold">Clic aquí para habilitar sonido y voz</button>
    <span class="fxbar" id="fxbar" hidden>
      <select id="fxVoice" aria-label="Voz del narrador"></select>
      <button id="fxTest" class="small">Probar voz</button>
    </span></div>
  <p class="fxwarn" id="fxwarn" hidden></p>
</header>

<section id="join" hidden>
  <div class="join">
    <div><div class="k">Escanea el código o entra desde tu celular a</div><div class="url" id="url"></div><div class="count" id="count"></div></div>
    <div id="qr"></div>
  </div>
</section>
<main id="view"><p class="muted">Conectando…</p></main>
<div id="zoom" hidden></div>
<div id="overlay" hidden></div>
<canvas id="fx"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/common.js"></script>
<script src="/sfx.js"></script>
<script>
const STEP = 3800; // milisegundos por llave en el sorteo (da tiempo a que la voz anuncie cada cruce)
const CONSUELO = ['¡Gran esfuerzo, {n}! Lo diste todo.', 'Gracias por participar, {n}. ¡La próxima es tuya!',
  '{n} cae con la frente en alto. ¡Aplausos!', '¡Qué gran duelo, {n}! Hoy no se dio, pero dejaste huella.'];
const seen = new Set();
let lastVoteKey = '', lastVotes = 0;
let drawSig = '', lastTick = 0, lastStageKey = '', lastDuelKey = '', lastImgs = -1, said = {};
let first = true, lastEvent = null, lastPhase = null, overlayT = null, view = '', endedFor = 0, lastSec = -1, drawDone = false;

// ---------- sonido y voz
const fanfare = () => FX.play('fanfare');
const buzzer = () => FX.play('buzzer');
const plainName = id => (player(id) || {}).name || '';
$('sound').onclick = () => {
  FX.unlock();
  $('sound').hidden = true; $('fxbar').hidden = false;
  FX.play('chime');
  FX.say('Sonido activado. Bienvenidos al Torneo de Prompts TEINCO 2026.', { flush: true });
};
$('fxVoice').onchange = e => { FX.setVoice(e.target.value); FX.say('Hola, esta es la voz del narrador del torneo.', { flush: true }); };
$('fxTest').onclick = () => FX.say('Hola, esta es la voz del narrador del torneo.', { flush: true });
FX.onVoices(() => {
  $('fxVoice').innerHTML = FX.voices.map(v => '<option value="' + esc(v.name) + '">' + esc(v.name.replace(/^Microsoft /, '').replace(/ - .*$/, '')) + ' (' + v.lang + ')' + (FX.isMale(v) ? ' ♂' : '') + '</option>').join('') || '<option>Sin voces en español</option>';
  if (FX.voice) $('fxVoice').value = FX.voice.name;
  const w = $('fxwarn');
  w.hidden = !FX.voices.length || FX.isMale(FX.voice) && /natural|online|neural/i.test(FX.voice.name);
  w.textContent = !FX.voices.length ? '' : FX.isMale(FX.voice)
    ? 'Para una voz masculina más natural abre esta pantalla en Microsoft Edge (voces "Natural", por ejemplo Gonzalo o Jorge).'
    : 'No se encontró una voz masculina en este navegador. Abre esta pantalla en Microsoft Edge para usar la voz natural de Gonzalo o Jorge.';
});

// ---------- confeti
const fx = $('fx'), ctx = fx.getContext('2d');
let bits = [], fxOn = false;
function confetti(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ['#ffc83d', '#6d93ff', '#4fd69a', '#ff8a80', '#f783ac', '#131a2b'];
  for (let i = 0; i < n; i++) bits.push({ x: Math.random() * fx.width, y: -20 - Math.random() * fx.height * .5, vx: (Math.random() - .5) * 4,
    vy: 2 + Math.random() * 5, s: 6 + Math.random() * 8, r: Math.random() * 6, c: cols[i % cols.length] });
  if (!fxOn) { fxOn = true; requestAnimationFrame(frame); }
}
function frame() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  bits = bits.filter(b => b.y < fx.height + 20);
  for (const b of bits) { b.x += b.vx; b.y += b.vy; b.r += .12; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); }
  if (bits.length) requestAnimationFrame(frame); else fxOn = false;
}

// ---------- superposiciones
function overlay(html, ms) {
  $('overlay').innerHTML = html; $('overlay').hidden = false;
  clearTimeout(overlayT); overlayT = setTimeout(() => { $('overlay').hidden = true; }, ms);
}
function celebrate(ev) {
  if (ev.type === 'auto') { overlay('<div class="big" style="font-size:clamp(2rem,5vw,3.6rem)">⏱ Se cerró la carga</div><div class="mid">Quien no subió su imagen a tiempo pierde su duelo automáticamente.</div>', 5000); buzzer(); FX.say('Se cerró la carga. Quien no subió su imagen a tiempo pierde su duelo automáticamente.'); return; }
  const s = STATE, T = s.rounds.length, w = player(ev.winner), l = player(ev.loser);
  const wn = w ? esc(w.name) : '', ln = l ? esc(l.name) : '';
  let big, mid, soft;
  if (ev.type === 'champion') {
    big = '🏆 ¡' + wn + ' es campeón!'; mid = '¡Felicitaciones! Se lleva el torneo.';
    soft = '🥈 Subcampeón: ' + avatar(l) + ' <strong>' + ln + '</strong>. ¡Un torneo enorme!';
  } else if (ev.type === 'third') {
    big = '🥉 ¡Tercer puesto para ' + wn + '!'; mid = '¡Felicitaciones! Se sube al podio.';
    soft = avatar(l) + ' <strong>' + ln + '</strong> termina en cuarto lugar. ¡Gran torneo!';
  } else {
    big = '🎉 ¡Felicitaciones, ' + wn + '!'; mid = 'Avanza a ' + (ev.r + 1 === T - 1 ? 'la gran final' : roundName(ev.r + 1, T));
    soft = avatar(l) + '<span>' + (ev.r === T - 2 && s.third && (s.third.a === ev.loser || s.third.b === ev.loser)
      ? '<strong>' + ln + '</strong> todavía pelea por el tercer puesto. ¡Ánimo!'
      : CONSUELO[ev.id % CONSUELO.length].replace('{n}', '<strong>' + ln + '</strong>')) + '</span>';
  }
  overlay(avatar(w) + '<div class="big">' + big + '</div><div class="mid">' + mid + '</div><div class="soft">' + soft + '</div>', ev.type === 'champion' ? 11000 : 7000);
  confetti(ev.type === 'champion' ? 420 : 160); fanfare();
  if (ev.type === 'champion') { FX.play('applause'); setTimeout(() => { confetti(300); fanfare(); FX.play('applause'); }, 2500); }
  else setTimeout(() => FX.play(ev.type === 'third' ? 'applause' : 'sad'), 1300);
  const tmp = document.createElement('div'); tmp.innerHTML = big + '. ' + mid + '. ' + soft;
  FX.say(ev.type === 'champion' ? '¡' + plainName(ev.winner) + ' es el campeón del Torneo de Prompts TEINCO 2026! ¡Felicitaciones! ' + plainName(ev.loser) + ' es el subcampeón. ¡Un torneo enorme!' : tmp.textContent);
}
function banner(r) {
  const T = STATE.rounds.length, fin = r === T - 1;
  overlay('<div class="k" style="font-size:2rem">' + (fin ? 'Llegó el momento' : 'Comienza la fase') + '</div><div class="big">' +
    (fin ? '🏆 La gran final' : roundName(r, T)) + '</div><div class="mid">' + (fin ? 'Solo queda un duelo por la gloria' : '¡Mucha suerte a todos!') + '</div>', fin ? 5500 : 3800);
  if (fin) confetti(220);
  fanfare(); FX.play('whoosh');
  FX.say(fin ? 'Llegó el momento. ¡La gran final! Solo queda un duelo por la gloria.' : 'Comienza la fase: ' + roundName(r, T) + '. ¡Mucha suerte a todos!');
}

// ---------- imágenes de los duelos
function imgSrc(id, key) { const v = STATE.images && STATE.images[id] && STATE.images[id][key]; return v ? '/img/' + id + '_' + key + '.jpg?v=' + v : ''; }
function pic(id, key, mode) {
  const has = id && STATE.images && STATE.images[id] && STATE.images[id][key];
  if (mode === 'status') return '<div class="pic st' + (has ? ' ok' : '') + '">' + (has ? '✓ Imagen recibida' : 'Esperando imagen…') + '</div>';
  if (mode === 'none') return '<div class="pic">Imagen pendiente</div>';
  const src = has && imgSrc(id, key);

}
function refHTML(r, ref, big) {
  if (!ref) return '<div class="refb"><p class="muted">Sin referencia para esta ronda.</p></div>';
  return '<div class="refb' + (big ? ' big' : '') + (ref.img ? '' : ' notxt') + '">' + (ref.img ? '<div class="pic has"><img alt="Referencia" src="/img/ref_' + r + '.jpg?v=' + ref.img + '"></div>' : '') +
    '<div class="reft"><div class="k">Referencia</div>' + (ref.text ? '<p>' + esc(ref.text) + '</p>' : '') + '</div></div>';
}
$('view').addEventListener('click', e => {
  const c = e.target.closest('.dc[data-key]'); if (!c) return;
  const key = c.dataset.key, side = id => { const p = player(id); return '<div class="zs">' + pic(id, key, STATE.stage && STATE.stage.name === 'results' ? 'show' : 'status') + '<div class="zn">' + avatar(p) + '<span>' + (p ? esc(p.name) : '') + '</span></div></div>'; };
  const rr = refKey(STATE, key), ref = STATE.refs && STATE.refs[rr];
  const mid = STATE.stage && STATE.stage.name === 'results' && ref ? '<div class="zs zref">' + (ref.img ? '<div class="pic has"><img alt="Referencia" src="/img/ref_' + rr + '.jpg?v=' + ref.img + '"></div>' : '') + '<div class="zn">Referencia</div>' + (ref.text ? '<p class="zt">' + esc(ref.text) + '</p>' : '') + '</div>' : '<span class="vs">VS</span>';
  $('zoom').innerHTML = '<div class="k" style="text-align:center;font-size:1.4rem">' + (key === 't' ? 'Tercer y cuarto puesto' : roundName(+key, STATE.rounds.length)) + ' · clic para cerrar</div><div class="zrow' + (mid.startsWith('<span') ? '' : ' three') + '">' + side(c.dataset.a) + mid + side(c.dataset.b) + '</div>';
  $('zoom').hidden = false;

$('zoom').onclick = () => { $('zoom').hidden = true; };

// ---------- vistas
const who = (id, cls) => { const p = player(id); return '<div class="' + cls + '">' + avatar(p) + '<span>' + (p ? esc(p.name) : '') + '</span></div>'; };
function slot(mt, k) {
  if (k === 'b' && mt.bye) return '<div class="slot e"><span class="av ghost">·</span><span>pasa directo</span></div>';
  const p = player(mt[k]);
  if (!p) return '<div class="slot e">' + avatar(null) + '<span>por definir</span></div>';
  const c = mt.winner ? (mt.winner === k ? 'w' : 'l') : '';
  return '<div class="slot ' + c + '">' + avatar(p) + '<span>' + esc(p.name) + '</span>' + (c === 'w' && !mt.bye ? '<span>✓</span>' : '') + '</div>';
}
function bracketHTML(s) {
  const T = s.rounds.length, cur = s.current;
  return '<div class="bracket">' + s.rounds.map((rnd, r) => '<div class="round' + (r === s.activeRound ? ' active' : '') + '"><h3>' + roundName(r, T) + '</h3><div class="ms">' +
    rnd.map((mt, m) => '<div class="match' + (cur && cur.r === r && cur.m === m ? ' cur' : '') + '">' + slot(mt, 'a') + slot(mt, 'b') + '</div>').join('') +
    (r === T - 1 && s.third && s.third.a && s.third.b ? '<div><div class="tl">Tercer y cuarto puesto</div><div class="match' + (cur && cur.third ? ' cur' : '') + '">' + slot(s.third, 'a') + slot(s.third, 'b') + '</div></div>' : '') +
    '</div></div>').join('') + '</div>';
}
function side(p, cls) { return '<div class="side ' + cls + '">' + avatar(p) + '<div class="nm">' + (p ? esc(p.name) : '?') + '</div></div>'; }

function renderDraw() {
  const s = STATE, f = s.rounds[0], el = now() - s.drawAt, idx = Math.floor(el / STEP), names = f.flatMap(m => [m.a, m.b]).filter(Boolean);
  const rnd = () => player(names[Math.floor(Math.random() * names.length)]);
  let html;
  if (idx >= f.length) {
    drawDone = true;
    if (drawSig !== 'done') { drawSig = 'done'; FX.play('fanfare'); FX.say('Sorteo completo. Estos son los cruces. ¡Que comience el torneo!'); }
    html = '<div class="stage"><div class="k" style="font-size:1.6rem">Sorteo completo</div><p class="muted" style="font-size:1.2rem;margin:6px 0 0">Estos son los cruces. En un momento comienza la primera fase.</p></div>';
  } else {
    const mt = f[idx], t = el - idx * STEP, aSet = t > STEP * .3, bSet = t > STEP * .55;
    const sig = idx + (aSet ? 'a' : '') + (bSet ? 'b' : '');
    if (sig !== drawSig) { if (drawSig && (aSet || bSet)) FX.play('lock'); drawSig = sig;
      if (bSet) FX.say('Llave ' + (idx + 1) + ': ' + plainName(mt.a) + (mt.bye ? ', pasa directo a la siguiente ronda.' : ' contra ' + plainName(mt.b) + '.')); }
    else if (!bSet && Date.now() - lastTick > 110) { lastTick = Date.now(); FX.play('tick'); }
    const b = mt.bye ? '<div class="side set"><span class="av ghost">·</span><div class="nm">Pasa directo</div></div>' : side(bSet ? player(mt.b) : rnd(), bSet ? 'set' : 'spin');
    html = '<div class="stage"><div class="k" style="font-size:1.6rem">Llave ' + (idx + 1) + ' de ' + f.length + '</div><div class="duel">' +
      side(aSet ? player(mt.a) : rnd(), aSet ? 'set' : 'spin') + '<div class="vs">VS</div>' + b + '</div></div>';
  }
  html += '<div class="pairs">' + f.slice(0, Math.min(idx, f.length)).map((mt, i) => '<div class="pair" style="animation:none"><span class="n">' + (i + 1) + '</span>' +
    who(mt.a, 'who') + '<span class="muted">vs</span>' + (mt.bye ? '<div class="who muted"><span>pasa directo</span></div>' : who(mt.b, 'who')) + '</div>').join('') + '</div>';
  $('view').innerHTML = html;
}

let viewSig = '';
function render() {
  const s = STATE, T = s.rounds ? s.rounds.length : 0;
  const cd = s.phase === 'torneo' && s.stage && s.stage.name === 'results' ? currentDuel(s) : null;
  const sig = s.phase + ':' + s.activeRound + ':' + (s.stage ? s.stage.name : '') + ':' + (cd ? cd.key + cd.mt.a : '');
  if (sig !== viewSig) { viewSig = sig; const v = $('view'); v.classList.remove('enter'); if (s.phase !== 'sorteo') { void v.offsetWidth; v.classList.add('enter'); clearTimeout(render.t); render.t = setTimeout(() => v.classList.remove('enter'), 900); } }
  view = s.phase;
  $('join').hidden = s.phase !== 'registro';
  $('phase').textContent = s.phase === 'registro' ? (s.regOpen ? 'Inscripciones abiertas' : 'Inscripciones cerradas') : s.phase === 'sorteo' ? 'Sorteo en vivo'
    : s.phase === 'fin' ? 'Torneo terminado' : roundName(s.activeRound, T);
  if (view === 'registro') {
    const lim = s.cupos ? Math.min(s.cupos, s.players.length) : s.players.length;
    $('count').textContent = s.players.length + (s.players.length === 1 ? ' inscrito' : ' inscritos') + (s.cupos ? ' · ' + s.cupos + ' cupos' : '');
    $('view').innerHTML = s.players.length ? '<div class="chips">' + s.players.map((p, i) => '<div class="chip' + (seen.has(p.id) ? '' : ' new') + (i >= lim ? ' out' : '') + '">' + avatar(p) + '<span>' + esc(p.name) + '</span></div>').join('') + '</div>'
      : '<p class="muted" style="text-align:center;font-size:1.3rem">Aún no hay inscritos. Los participantes aparecen aquí apenas se registran.</p>';
    s.players.forEach(p => seen.add(p.id));
  } else if (view === 'sorteo') { drawDone = false; renderDraw(); }
  else if (view === 'torneo') {
    const r = s.activeRound, st = s.stage ? s.stage.name : 'prep', ref = s.refs && s.refs[r];
    const mode = st === 'results' ? 'show' : st === 'upload' ? 'status' : 'none';
    const ds = (mt, k, key) => { const p = player(mt[k]), c = mt.winner ? (mt.winner === k ? ' w' : ' l') : ''; return '<div class="dside' + c + '">' + pic(mt[k], key, mode) + '<div class="row" style="justify-content:center;gap:8px">' + avatar(p) + '<span>' + (p ? esc(p.name) : '') + '</span></div></div>'; };
    const card = (mt, label, key) => '<div class="dc' + (mt.winner ? ' done' : '') + '" data-key="' + key + '" data-a="' + mt.a + '" data-b="' + mt.b + '" title="Clic para ampliar">' + (label ? '<div class="k">' + label + '</div>' : '') + '<div class="drow">' + ds(mt, 'a', key) + '<span class="vs">VS</span>' + ds(mt, 'b', key) + '</div></div>';
    const fin = r === T - 1, hasThird = fin && s.third && s.third.a && s.third.b;
    const cards = s.rounds[r].filter(mt => !mt.bye && mt.a && mt.b).map(mt => card(mt, fin ? 'Final' : '', String(r))).join('') + (hasThird ? card(s.third, 'Tercer y cuarto puesto', 't') : '');
    const title = { prep: 'Prepárense · en un momento la referencia', ref: 'Referencia · obsérvenla con atención', upload: '¡Suban su imagen!', results: 'Resultados de la ronda' }[st];
    let html = '<div class="stage"><div class="k" style="font-size:1.6rem">' + roundName(r, T) + ' · ' + title + '</div><div id="clock"></div></div>';
    const list = phaseMatches(s), cur = st === 'results' ? (list.find(x => !x.mt.winner) || null) : null;
    if (cur) {
      // Resultados llave por llave: imagen A · referencia · imagen B
      const n = list.indexOf(cur) + 1, vt = votesOf(s, cur), tot = vt.a + vt.b;
      const vbar = k => { const pc = tot ? Math.round(vt[k] * 100 / tot) : 0, lead = tot && vt[k] > vt[k === 'a' ? 'b' : 'a'];
        return '<div class="vote' + (lead ? ' lead' : '') + '"><div class="vnum"><b>' + vt[k] + '</b> ' + (vt[k] === 1 ? 'voto' : 'votos') + (tot ? ' · ' + pc + '%' : '') + '</div><div class="vtrack"><i style="transform:scaleX(' + (tot ? vt[k] / tot : 0) + ')"></i></div></div>'; };
      const side = (id, k) => { const p = player(id); return '<div class="oside">' + pic(id, cur.key, 'show') + '<div class="zn">' + avatar(p) + '<span>' + (p ? esc(p.name) : '') + '</span></div>' + vbar(k) + '</div>'; };
      const mid = '<div class="oside oref">' + (ref && ref.img ? '<div class="pic has"><img alt="Referencia" src="/img/ref_' + r + '.jpg?v=' + ref.img + '"></div>' : '') +
        '<div class="zn">Referencia</div>' + (ref && ref.text ? '<p class="zt">' + esc(ref.text) + '</p>' : '') + '</div>';
      $('view').innerHTML = '<div class="stage"><div class="k" style="font-size:1.6rem">' + roundName(r, T) + ' · ' + esc(cur.label) + ' · duelo ' + n + ' de ' + list.length + '</div></div>' +
        '<p class="votehint">Vota desde tu celular por la imagen que mejor siga la referencia</p>' +
        '<div class="one">' + side(cur.mt.a, 'a') + mid + side(cur.mt.b, 'b') + '</div>' +
        '<div class="tl" style="margin:22px 0 8px">Llaves</div>' + bracketHTML(s);
      lastSec = -1; tick(); return;
    }
    if (st === 'results') html = '<div class="stage"><div class="k" style="font-size:1.6rem">' + roundName(r, T) + ' · Ronda terminada</div><p class="muted" style="margin:6px 0 0;font-size:1.2rem">Estos son todos los resultados de la ronda.</p></div>';
    if (st === 'ref') html += refHTML(r, ref, true);
    else {
      if (st === 'results' && ref) html += refHTML(r, ref, false);
      html += '<div class="duels">' + cards + '</div>';
    }
    $('view').innerHTML = html + '<div class="tl" style="margin:22px 0 8px">Llaves</div>' + bracketHTML(s);
    lastSec = -1; tick();
  }
  else if (view === 'fin') {
    const pod = podium(s), st = (id, c, medal, label) => id ? '<div class="step ' + c + '"><div class="medal">' + medal + '</div>' + avatar(player(id)) +
      '<div class="nm">' + esc((player(id) || {}).name || '') + '</div><div class="k">' + label + '</div></div>' : '';
    $('view').innerHTML = '<div class="podium">' + st(pod.second, 'p2', '🥈', 'Subcampeón') + st(pod.first, 'p1', '🏆', 'Campeón') + st(pod.third, 'p3', '🥉', 'Tercer puesto') + '</div>' +
      (pod.fourth ? '<p class="muted" style="text-align:center;font-size:1.2rem">Cuarto puesto: <strong>' + esc((player(pod.fourth) || {}).name || '') + '</strong></p>' : '') + bracketHTML(s);

}
function tick() {
  if (!STATE) return;
  if (view === 'sorteo' && !drawDone) renderDraw();

  c.hidden = false;
  const sec = Math.ceil(ms / 1000), end = STATE.stage.endsAt;
  if (ms <= 0) {
    c.textContent = '¡Tiempo terminado!'; c.className = 'end';
    if (endedFor !== end) { endedFor = end; buzzer(); FX.say('¡Tiempo!', { flush: true }); }
  } else {
    c.textContent = fmt(ms); c.className = sec <= 10 ? 'low' : '';
    if (sec !== lastSec && lastSec !== -1) {
      const k = end + ':' + sec;
      if (sec === 60 && !said[k]) { said[k] = 1; FX.say('Queda un minuto.'); }
      if (sec === 30 && !said[k]) { said[k] = 1; FX.say('Quedan treinta segundos.'); }
      if (sec === 10 && !said[k]) { said[k] = 1; FX.say('¡Diez segundos!', { flush: true }); }
      if (sec <= 10) FX.play(sec <= 3 ? 'tickHi' : 'tick');
    }

  }
}
setInterval(tick, 150);

// Narración: compara el estado nuevo con el anterior y anuncia lo que cambió
function announce(s) {
  const T = s.rounds ? s.rounds.length : 0;
  if (s.phase === 'registro') {
    const nuevos = s.players.filter(p => !seen.has(p.id));
    if (nuevos.length) { FX.play('welcome'); FX.say(nuevos.length > 2 ? 'Se inscribieron ' + nuevos.length + ' participantes más. ¡Bienvenidos!' : nuevos.map(p => 'Bienvenido, ' + p.name + '.').join(' ')); }
  }
  if (s.phase === 'sorteo' && lastStageKey !== 'sorteo') { lastStageKey = 'sorteo'; FX.play('drumroll'); FX.say('¡Comienza el sorteo! Atentos a sus pantallas.', { flush: true }); }
  if (s.phase === 'torneo' && s.stage) {
    const r = s.activeRound, st = s.stage.name, key = r + ':' + st, ref = s.refs && s.refs[r];
    if (key !== lastStageKey) {
      lastStageKey = key;
      if (st === 'ref') { FX.play('gong'); FX.say('Atención. Esta es la referencia de ' + roundName(r, T) + '. ' + (ref && ref.text ? ref.text + '. ' : 'Observen la imagen con atención. ') + 'Tienen ' + durText(s.refDuration) + ' para observarla.'); }
      if (st === 'upload') { FX.play('horn'); FX.say('Se oculta la referencia. Se abre la carga de imágenes: tienen ' + durText(s.duration) + ' para subir su imagen desde el celular. Quien no suba imagen, pierde.'); lastImgs = -1; }
      if (st === 'results') FX.say('Se cerró la carga. ¡Veamos los resultados!');
    }
    if (st === 'upload') {
      const n = phaseMatches(s).reduce((a, x) => a + [x.mt.a, x.mt.b].filter(id => s.images[id] && s.images[id][x.key]).length, 0);
      if (lastImgs >= 0 && n > lastImgs) FX.play('blip');
      lastImgs = n;
    }
    if (st === 'results') {
      const list = phaseMatches(s), cur = list.find(x => !x.mt.winner);
      if (cur) { const vt = votesOf(s, cur), n = vt.a + vt.b, vk = voteKey(cur); if (vk === lastVoteKey && n > lastVotes) FX.play('blip'); lastVoteKey = vk; lastVotes = n; }
      const dk = cur ? r + ':' + cur.key + ':' + cur.mt.a + cur.mt.b : r + ':fin';
      if (dk !== lastDuelKey) {
        lastDuelKey = dk;
        if (cur) { setTimeout(() => FX.play('drumroll'), 400); FX.say((cur.third ? 'Duelo por el tercer puesto' : cur.label === 'Final' ? 'La gran final' : cur.label) + ': ' + plainName(cur.mt.a) + ' contra ' + plainName(cur.mt.b) + '. Comparen las imágenes con la referencia y voten desde su celular. ¿Quién ganará?'); }
        else if (s.phase === 'torneo') FX.say('Terminó ' + roundName(r, T) + '. Estos son todos los resultados de la ronda.');
      }
    }
  }
  if (s.phase === 'fin' && lastStageKey !== 'fin') {
    lastStageKey = 'fin';
    const pod = podium(s);
    setTimeout(() => FX.play('applause'), 500);
    FX.say('Este es el podio final. Campeón: ' + plainName(pod.first) + '. Subcampeón: ' + plainName(pod.second) + '.' + (pod.third ? ' Tercer puesto: ' + plainName(pod.third) + '.' : '') + ' ¡Gracias a todos por participar!');
  }
}

connect(s => {
  if (s.audio) FX.configure({ sound: s.audio.screenSound, voice: s.audio.screenVoice });
  if (first) { first = false; lastEvent = s.event && s.event.id; lastPhase = s.phaseEvent && s.phaseEvent.id; s.players.forEach(p => seen.add(p.id)); if (s.stage && s.stage.endsAt && stageLeft(s) <= 0) endedFor = s.stage.endsAt; }
  const isFirst = !lastStageKey && !lastDuelKey;
  if (isFirst) { lastStageKey = s.phase === 'torneo' && s.stage ? s.activeRound + ':' + s.stage.name : s.phase; const c = currentDuel(s); lastDuelKey = c ? s.activeRound + ':' + c.key + ':' + c.mt.a + c.mt.b : s.activeRound + ':fin'; }
  const newcomers = s.phase === 'registro' ? s.players.filter(p => !seen.has(p.id)) : [];
  if (s.event && s.event.id !== lastEvent) celebrate(s.event);
  if (s.phaseEvent && s.phaseEvent.id !== lastPhase) banner(s.phaseEvent.r);
  if (!isFirst) announce(s);
  render();
  lastEvent = s.event && s.event.id; lastPhase = s.phaseEvent && s.phaseEvent.id;
});
const link = location.origin + '/';
$('url').textContent = location.host;
try { new QRCode($('qr'), { text: link, width: 180, height: 180 }); } catch (e) { $('qr').hidden = true; }
